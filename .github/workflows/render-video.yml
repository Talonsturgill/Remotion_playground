name: Render Video

on:
  workflow_dispatch:  # Manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'n8n-video/**'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            libpango-1.0-0 \
            libcairo2 \
            libnss3 \
            libnspr4 \
            libxss1 \
            fonts-liberation \
            libappindicator3-1 \
            xdg-utils

      - name: Install dependencies
        working-directory: n8n-video
        run: npm install

      - name: Build
        working-directory: n8n-video
        run: npm run build --if-present

      - name: Render video
        working-directory: n8n-video
        run: |
          mkdir -p out
          npx remotion render src/index.tsx N8nExplainer out/video.mp4 --log=verbose

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: n8n-video/out/video.mp4
          retention-days: 30
